name: Linux

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v1

    - name: 下载submodule源码
      run: mv -f .gitmodules_github .gitmodules && git submodule sync && git submodule update --init

    - name: 下载 SRTP
      uses: actions/checkout@v2
      with:
        repository: cisco/libsrtp
        fetch-depth: 1
        ref: v2.3.0
        path: 3rdpart/libsrtp

    - name: 下载 openssl
      uses: actions/checkout@v2
      with:
        repository: openssl/openssl
        fetch-depth: 1
        ref: OpenSSL_1_1_1
        path: 3rdpart/openssl

    - name: 下载 usrsctp
      uses: actions/checkout@v2
      with:
        repository: sctplab/usrsctp
        fetch-depth: 1
        ref: 0.9.5.0
        path: 3rdpart/usrsctp

    - name: 设置 QEMU
      uses: docker/setup-qemu-action@v2

    - name: 设置 Docker buildx
      uses: docker/setup-buildx-action@v2

    - name: 在 aarch64 容器中编译（QEMU 模拟）
      run: |
        docker pull --platform=linux/arm64 ubuntu:22.04
        docker run --platform=linux/arm64 -v $(pwd):/root -w /root --rm ubuntu:22.04 bash -lc "
          set -ex
          export DEBIAN_FRONTEND=noninteractive

          apt update
          apt install -y --no-install-recommends build-essential git wget cmake pkg-config ca-certificates autoconf automake libtool perl python3 unzip

          mkdir -p /root/install

          if [ -d 3rdpart/openssl ]; then
            cd 3rdpart/openssl
            ./config no-shared --prefix=/root/install
            make -j $(nproc)
            make install
            cd /root
          fi

          if [ -d 3rdpart/usrsctp ]; then
            cd 3rdpart/usrsctp
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..
            make -j $(nproc)
            make install
            cd /root
          fi

          if [ -d 3rdpart/libsrtp ]; then
            cd 3rdpart/libsrtp
            ./configure --enable-openssl --with-openssl-dir=/root/install
            make -j $(nproc)
            make install
            cd /root
          fi

          mkdir -p linux_build && cd linux_build
          cmake .. -DOPENSSL_ROOT_DIR=/root/install -DCMAKE_BUILD_TYPE=Release
          make -j $(nproc)

          # 将平台产物拷贝到顶层 release/ 供 upload 使用
          mkdir -p release
          if [ -d ../release/linux/Release ]; then
            cp -r ../release/linux/Release/* release/ || true
          fi
        "

    - name: 卸载 QEMU（清理 binfmt）
      if: always()
      run: |
        set -ex
        ls -l /proc/sys/fs/binfmt_misc || true
        docker run --privileged --rm tonistiigi/binfmt --uninstall qemu-aarch64 || \
        docker run --privileged --rm tonistiigi/binfmt --remove qemu-aarch64 || true
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

    - name: 设置环境变量
      run: |
        echo "BRANCH=$(echo ${GITHUB_REF#refs/heads/} | tr -s "/\?%*:|\"<>" "_")" >> $GITHUB_ENV
        echo "BRANCH2=$(echo ${GITHUB_REF#refs/heads/} )" >> $GITHUB_ENV
        echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

    - name: 打包二进制
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.workflow }}_${{ env.BRANCH }}_${{ env.DATE }}
        path: release/*
        if-no-files-found: error
        retention-days: 90
