name: Docker

on:
  push:
    branches:
      - "master"
      - "feature/*"
      - "release/*"
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  IMAGE_NAME: zlmediakit/zlmediakit

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: 下载submodule源码
        run: mv -f .gitmodules_github .gitmodules && git submodule sync && git submodule update --init

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@d572c9c13673d2e0a26fabf90b5748f36886883f

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      # Login against a Docker registry only when secret is present
      - name: Log into registry ${{ env.REGISTRY }}
        if: ${{ secrets.DOCKER_IO_SECRET != '' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: zlmediakit
          password: ${{ secrets.DOCKER_IO_SECRET }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (push disabled for testing)
      - name: Build and push Docker image
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/feature/test'
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MODEL=Release
          platforms: linux/amd64,linux/arm64

      # Signing step commented out for now
#      - name: Sign the published Docker image
#        if: ${{ github.event_name != 'pull_request' }}
#        env:
#          COSIGN_EXPERIMENTAL: "true"
#        run: cosign sign ${{ steps.meta.outputs.tags }}@${{ steps.build-and-push.outputs.digest }}
